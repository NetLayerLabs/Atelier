# Atelier behind a host nginx (one hostname): /api and /static -> backend, everything else -> dashboard.
# Install: copy to /etc/nginx/sites-available/atelier, link into sites-enabled, set server_name, then
#   nginx -t && systemctl reload nginx && certbot --nginx -d <host> --redirect
server {
    server_name atelier.example.com;

    client_max_body_size 30m;   # mood boards, sketches and supplier quote PDFs

    location ~ ^/(api|static)/ {
        proxy_pass http://127.0.0.1:8870;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;   # model calls, quote extraction
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8871;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}
