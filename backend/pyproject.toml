[project]
name = "atelier-backend"
version = "0.1.0"
description = "Atelier backend — autonomous fashion & merchandising agent (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_vision: do not install the canned vision test double (exercise the real not-connected / live path)",
]
